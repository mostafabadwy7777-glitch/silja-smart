name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root. Upload your project zip to the repo root first."
            exit 1
          fi
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      # لازم قبل ما نبدأ بناء جديد، نلغي أي بناء قديم لسه "شغال" أو "في الطابور"
      # عشان الفري تير في EAS بيسمح ببناء واحد بس في نفس الوقت. لو فيه بناء قديم
      # واقف (اتعلق أو حد شغّل الأكشن مرتين)، البناء الجديد هيفضل ينتظر في
      # الطابور من غير ما يبدأ خالص، وده اللي بيخلي الأكشن يقف/يعلق لحد ما
      # يضرب التايم آوت بعد نص ساعة.
      - name: Cancel old stuck EAS builds
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Checking for old builds that are still queued or running..."
          npx eas-cli build:list --platform android --limit 15 --non-interactive --json > old-builds.json || echo "[]" > old-builds.json

          node -e "
            const fs = require('fs');
            let builds = [];
            try { builds = JSON.parse(fs.readFileSync('old-builds.json', 'utf8')); } catch (e) { builds = []; }
            const activeStatuses = ['new', 'in-queue', 'in-progress', 'pending-cancel'];
            const active = builds.filter(b => activeStatuses.includes(b.status));
            fs.writeFileSync('active-ids.txt', active.map(b => b.id).join('\n'));
            if (active.length) {
              console.log('Old builds still active:', active.map(b => \`\${b.id} (\${b.status})\`).join(', '));
            } else {
              console.log('No old builds to cancel.');
            }
          "

          if [ -s active-ids.txt ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              echo "Cancelling old build: $id"
              npx eas-cli build:cancel "$id" --non-interactive || echo "Could not cancel $id (it may have finished already), continuing..."
            done < active-ids.txt
          fi

      - name: Build on EAS (free tier)
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json > build-start.json
          cat build-start.json

      - name: Wait for EAS build and download APK
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-start.json','utf8'))[0].id)")
          echo "Build ID: $BUILD_ID"

          STATUS="unknown"
          for i in $(seq 1 60); do
            npx eas-cli build:view "$BUILD_ID" --json > build-status.json
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-status.json','utf8')).status.toLowerCase())")
            echo "[$i] status: $STATUS"
            if [ "$STATUS" = "finished" ] || [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              break
            fi
            sleep 30
          done

          if [ "$STATUS" != "finished" ]; then
            echo "Build did not finish successfully (status: $STATUS)"
            exit 1
          fi

          ARTIFACT_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-status.json','utf8')).artifacts.buildUrl)")
          echo "APK URL: $ARTIFACT_URL"
          curl -L "$ARTIFACT_URL" -o app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silja-smart-release-${{ github.run_number }}
          path: mobile-app/app-release.apkname: Build Android APK (EAS)

