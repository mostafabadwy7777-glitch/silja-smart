name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n1)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi

      - name: Locate project root
        run: |
          set -e
          PROJECT_DIR=$(find . -type f \( -name app.json -o -name app.config.js -o -name app.config.ts \) \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/server/*" \
            -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Expo project (app.json) not found in the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install
          npm install -g eas-cli

      - name: Validate Expo project
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -f package.json || { echo "::error::package.json missing in $PWD"; exit 1; }
          test -f app.json || test -f app.config.js || test -f app.config.ts || { echo "::error::no app config in $PWD"; exit 1; }
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN secret is empty. Add it in Settings > Secrets and variables > Actions."; exit 1; }
          eas --version
          eas whoami

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive

      - name: Download build artifact
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "EAS build finished. Check the EAS build output for the APK link."
