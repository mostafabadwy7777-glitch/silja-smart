name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root. Upload your project zip to the repo root first."
            exit 1
          fi
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Build on EAS (free tier)
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait > eas-build-output.txt
          cat eas-build-output.txt

      - name: Extract build URL and download APK
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' eas-build-output.txt | head -n1)
          echo "Build ID: $BUILD_ID"
          npx eas-cli build:view "$BUILD_ID" --json > build-info.json || true
          npx eas-cli build:wait "$BUILD_ID" || true
          npx eas-cli build:view "$BUILD_ID" --json > build-info-final.json
          ARTIFACT_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-info-final.json','utf8')).artifacts.buildUrl)")
          echo "APK URL: $ARTIFACT_URL"
          curl -L "$ARTIFACT_URL" -o app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silja-smart-release-${{ github.run_number }}
          path: mobile-app/app-release.apk
