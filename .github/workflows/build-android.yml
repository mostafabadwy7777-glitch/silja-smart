name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old build artifacts (APKs) to free up storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching list of existing artifacts..."
          IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id')

          if [ -z "$IDS" ]; then
            echo "No old artifacts found — nothing to delete."
          else
            for ID in $IDS; do
              echo "Deleting artifact ID $ID"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID" || true
            done
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root. Upload your project zip to the repo root first."
            exit 1
          fi
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build on EAS (free tier)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json > build-start.json
          cat build-start.json

      - name: Wait for EAS build and download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-start.json','utf8'))[0].id)")
          echo "Build ID: $BUILD_ID"

          STATUS="unknown"
          for i in $(seq 1 60); do
            npx eas-cli@latest build:view "$BUILD_ID" --json > build-status.json
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-status.json','utf8')).status.toLowerCase())")
            echo "[$i] status: $STATUS"
            if [ "$STATUS" = "finished" ] || [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              break
            fi
            sleep 30
          done

          if [ "$STATUS" != "finished" ]; then
            echo "Build did not finish successfully (status: $STATUS)"
            exit 1
          fi

          ARTIFACT_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-status.json','utf8')).artifacts.buildUrl)")
          echo "APK URL: $ARTIFACT_URL"
          curl -L "$ARTIFACT_URL" -o app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silja-smart-release-${{ github.run_number }}
          path: app-release.apk
          retention-days: 7
